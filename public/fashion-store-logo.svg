<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C382" />
      <stop offset="35%" stop-color="#C59B51" />
      <stop offset="70%" stop-color="#F2DEB0" />
      <stop offset="100%" stop-color="#B28238" />
    </linearGradient>
    <linearGradient id="softGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Frame with gaps -->
  <path d="M 250,30 A 210,210 0 0,1 450,210" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 450,280 A 210,210 0 0,1 360,425" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 230,440 A 210,210 0 0,1 60,320" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 75,170 A 210,210 0 0,1 230,40" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />

  <!-- Top Coat Hanger & Mannequin Dress Form -->
  <g transform="translate(180, 42)">
    <!-- Hanger Hook -->
    <path d="M 70,30 C 70,12 85,12 85,24 C 85,32 70,38 70,50" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Hanger Arms -->
    <path d="M 15,65 Q 70,48 125,65" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Bottom crossbar -->
    <line x1="22" y1="64" x2="118" y2="64" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Mini dress silhouette on hanger -->
    <path d="M 64,65 L 76,65 L 79,78 C 79,84 76,88 78,98 L 62,98 C 64,88 61,84 61,78 Z" fill="#111827" />
  </g>

  <!-- Left Silhouette: Elegant Woman with Shopping Bag -->
  <g transform="translate(90, 115)">
    <!-- Head & Updo Hairstyle -->
    <circle cx="48" cy="46" r="14" fill="#111827" />
    <path d="M 38,42 C 34,30 54,20 62,32 C 67,40 60,54 52,56 C 45,56 36,50 38,42 Z" fill="#111827" />
    <!-- Gold Earring -->
    <circle cx="44" cy="52" r="3.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
    <!-- Elegant Neck & Shoulders -->
    <path d="M 49,60 C 51,70 54,78 44,88 C 36,96 34,106 32,120 L 52,120 C 58,105 60,95 62,80 C 63,70 55,62 49,60 Z" fill="#111827" />
    <!-- Off-shoulder Gown -->
    <path d="M 32,120 C 28,145 32,175 42,205 C 50,225 60,240 68,260 L 76,260 C 70,230 60,200 52,170 C 46,145 50,130 52,120 Z" fill="#111827" />
    <!-- Gold accent wrap on dress -->
    <path d="M 40,118 Q 55,130 65,150 Q 75,185 85,230" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Arm holding shopping bag -->
    <path d="M 35,95 C 24,115 18,145 18,180" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round" />
    <!-- Shopping Bag with Heart -->
    <g transform="translate(4, 185)">
      <path d="M 12,0 C 12,-10 26,-10 26,0" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
      <polygon points="4,2 34,2 38,42 0,42" fill="url(#softGold)" />
      <!-- Heart on bag -->
      <path d="M 19,22 C 19,20 16,16 13,18 C 10,20 11,23 19,29 C 27,23 28,20 25,18 C 22,16 19,20 19,22 Z" fill="#111827" />
    </g>
  </g>

  <!-- Right Silhouette: Dashing Gentleman in Tailored Suit -->
  <g transform="translate(295, 115)">
    <!-- Head & Stylish Groomed Hair -->
    <circle cx="56" cy="40" r="15" fill="#111827" />
    <path d="M 42,35 C 44,22 62,20 70,28 C 76,34 72,46 64,48 C 55,48 45,42 42,35 Z" fill="#111827" />
    <!-- Neck -->
    <rect x="52" y="55" width="9" height="12" fill="#111827" />
    <!-- White Shirt Collar V -->
    <polygon points="51,68 62,68 56,86" fill="#FFFFFF" />
    <!-- Tuxedo Suit Jacket -->
    <path d="M 22,78 C 30,70 48,67 56,67 C 64,67 82,70 90,78 L 94,170 C 85,178 75,180 56,180 C 37,180 27,178 18,170 Z" fill="#111827" />
    <!-- Satin Lapel lines -->
    <path d="M 38,76 L 56,115 L 74,76" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Gold Pocket Square -->
    <polygon points="73,98 83,96 79,92" fill="url(#goldGrad)" />
    <!-- Suit Trousers -->
    <path d="M 26,178 L 32,260 L 52,260 L 55,190 L 58,190 L 61,260 L 81,260 L 86,178 Z" fill="#111827" />
  </g>

  <!-- Center Monogram: Intertwined 'F' and Gold 'S' -->
  <g transform="translate(180, 140)">
    <!-- Classic Serif 'F' in Deep Charcoal/Navy -->
    <g fill="#111827">
      <!-- Main Vertical Stem with Serifs -->
      <path d="M 15,20 L 52,20 L 52,28 L 38,28 L 38,170 L 52,170 L 52,178 L 15,178 L 15,170 L 28,170 L 28,28 L 15,28 Z" />
      <!-- Top Horizontal Arm -->
      <path d="M 38,20 L 102,20 L 102,52 L 94,52 C 92,36 86,30 68,30 L 38,30 L 38,20 Z" />
      <!-- Middle Crossbar -->
      <path d="M 38,82 L 80,82 L 80,92 L 38,92 Z" />
    </g>

    <!-- Flowing Luxury Calligraphic 'S' in Metallic Gold Gradient -->
    <path d="M 118,52 C 105,40 85,38 72,48 C 55,62 60,86 82,98 C 110,114 125,134 116,160 C 105,188 68,198 42,185 C 32,180 24,170 20,160 L 28,154 C 34,168 50,178 68,174 C 88,169 98,150 94,136 C 88,118 68,106 50,94 C 32,82 30,60 44,44 C 60,26 90,26 112,42 Z"
          fill="url(#goldGrad)" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.15))" />
    <!-- Lower Tail Swirl of 'S' -->
    <path d="M 42,185 C 32,192 20,192 12,184 C 5,175 8,162 16,158 C 22,155 28,160 25,168 C 22,174 15,172 16,176 C 18,182 30,184 40,178 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Diamond Divider Star -->
  <g transform="translate(250, 360)">
    <polygon points="0,-8 6,0 0,8 -6,0" fill="url(#goldGrad)" />
    <line x1="-70" y1="0" x2="-18" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" />
    <line x1="18" y1="0" x2="70" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" />
  </g>

  <!-- Brand Typography: FASHION STORE -->
  <text x="250" y="405" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="6" fill="#111827">FASHION STORE</text>

  <!-- Tagline: STYLE • QUALITY • YOU -->
  <g transform="translate(250, 435)">
    <text x="-76" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" letter-spacing="3" fill="#6B7280">STYLE</text>
    <circle cx="-38" cy="-3.5" r="2.5" fill="url(#goldGrad)" />
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" letter-spacing="3" fill="#6B7280">QUALITY</text>
    <circle cx="38" cy="-3.5" r="2.5" fill="url(#goldGrad)" />
    <text x="76" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" letter-spacing="3" fill="#6B7280">YOU</text>
  </g>

  <!-- Bottom category icons with labels matching uploaded logo -->
  <g transform="translate(80, 465)">
    <!-- WOMEN -->
    <g transform="translate(25, 0)">
      <path d="M 0,-16 L 4,-8 L -4,-8 Z" fill="#111827" />
      <path d="M -6,-8 L 6,-8 L 10,4 L -10,4 Z" fill="#111827" />
      <text x="0" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#4B5563" letter-spacing="1">WOMEN</text>
    </g>
    <line x1="68" y1="-12" x2="68" y2="14" stroke="#E5E7EB" stroke-width="1" />
    
    <!-- MEN -->
    <g transform="translate(105, 0)">
      <path d="M -8,-14 L 8,-14 L 9,3 L -9,3 Z" fill="#111827" />
      <text x="0" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#4B5563" letter-spacing="1">MEN</text>
    </g>
    <line x1="145" y1="-12" x2="145" y2="14" stroke="#E5E7EB" stroke-width="1" />

    <!-- KIDS -->
    <g transform="translate(182, 0)">
      <path d="M -6,-12 L 6,-12 L 7,2 L -7,2 Z" fill="#111827" />
      <text x="0" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#4B5563" letter-spacing="1">KIDS</text>
    </g>
    <line x1="222" y1="-12" x2="222" y2="14" stroke="#E5E7EB" stroke-width="1" />

    <!-- ACCESSORIES -->
    <g transform="translate(262, 0)">
      <rect x="-8" y="-7" width="16" height="11" rx="2" fill="#111827" />
      <path d="M -5,-7 C -5,-13 5,-13 5,-7" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
      <text x="0" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#4B5563" letter-spacing="1">ACCESSORIES</text>
    </g>
    <line x1="305" y1="-12" x2="305" y2="14" stroke="#E5E7EB" stroke-width="1" />

    <!-- & MORE -->
    <g transform="translate(335, 0)">
      <circle cx="0" cy="-3" r="6" fill="none" stroke="#111827" stroke-width="2" />
      <line x1="0" y1="-8" x2="0" y2="-12" stroke="#111827" stroke-width="2.5" />
      <line x1="0" y1="2" x2="0" y2="6" stroke="#111827" stroke-width="2.5" />
      <text x="0" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#4B5563" letter-spacing="1">&amp; MORE</text>
    </g>
  </g>
</svg>
